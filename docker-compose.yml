services:
  db:
    image: pgvector/pgvector:pg17
    container_name: sla-db
    environment:
      POSTGRES_USER: sla
      POSTGRES_PASSWORD: sla
      POSTGRES_DB: sla
    ports:
      - "5432:5432"
    volumes:
      - sla-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sla"]
      interval: 3s
      retries: 20
volumes:
  sla-pgdata:
