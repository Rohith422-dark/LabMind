[project]
name = "smart-lab-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "slowapi>=0.1.9",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "google-genai>=1.0",
  "tenacity>=9.0",
  "aiolimiter>=1.1",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.uv]
package = false
